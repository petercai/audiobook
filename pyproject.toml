[build-system]
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[project]
name = "ebook2audiobook"
version = "0.0.0"
description = "Convert eBooks to audiobooks with chapters and metadata"
authors = [
    { name = "Drew Thomasson" }
]
dependencies = [
	"argostranslate",
	"beautifulsoup4",
	"cutlet",
	"deep_translator",
	"demucs",
	"docker",
	"ebooklib",
	"fastapi",
	"fugashi",
	"gradio>=5.42.0",
	"hangul-romanize",
	"indic-nlp-library",
	"iso-639",
	"jieba",
	"soynlp",
	"pythainlp",
	"pydub",
	"pyannote-audio>=4.0.3",
	"mutagen",
	"nvidia-ml-py",
	"PyOpenGL",
	"pypinyin",
	"ray",
	"regex",
	"translate",
	"tqdm",
	"pymupdf4llm",
	"sudachipy",
	"sudachidict_core",
	"transformers",
	"coqui-tts",
	"torchvggish",
	"numba>=0.60.0",
	"torch==2.8.*",
	"torchvision",
	"torchaudio==2.8.*",
	"unidic-lite",
	"voxcpm",
	"indextts",
	"huggingface-hub[hf-xet]",
	"pipdeptree>=2.30.0",
	"scipy-stubs==1.16.3.3",
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
scripts = { "ebook2audiobook" = "app:main" }

[project.urls]
"Homepage" = "https://github.com/DrewThomasson/ebook2audiobook"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
		"pyyaml", # pytest -> hydra (as a plugin or dependency) -> omegaconf -> import yaml
]
